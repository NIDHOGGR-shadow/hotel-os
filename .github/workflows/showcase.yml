name: Hotel OS checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned TypeScript
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Verify Hotel OS API, database model and interface
        run: npm test
      - name: Typecheck backend
        run: npm run typecheck
